<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuntBot panel</title>
    <!-- Oficjalna biblioteka Supabase przez CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Zmienne kolorystyczne dla motywów */
        :root {
            --bg-body: #0e1118;
            --bg-sidebar: #161b26;
            --bg-main: #0e1118;
            --bg-container: #111622;
            --bg-card: #1b2336;
            --border-color: #242c3d;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dimmed: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-main: #f8fafc;
            --bg-container: #ffffff;
            --bg-card: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #475569;
            --text-dimmed: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.2s, color 0.2s; }
        body { display: flex; height: 100vh; background-color: var(--bg-body); color: var(--text-main); overflow: hidden; }
        
        .sidebar { width: 280px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .logo { padding: 24px; font-size: 20px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid var(--border-color); }
        
        .menu-group { display: flex; flex-direction: column; }
        .menu-btn { background: none; border: none; color: var(--text-muted); padding: 16px 24px; text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .menu-btn:hover { background-color: var(--border-color); color: var(--text-main); }
        .menu-btn.active { background-color: var(--accent); color: #fff; font-weight: bold; }
        
        /* Rozwijana podzakładka */
        .submenu { 
            display: none; 
            flex-direction: column; 
            background-color: rgba(0,0,0,0.1); 
            border-bottom: 1px solid var(--border-color);
        }
        .submenu.open { display: flex; }
        .submenu-btn { background: none; border: none; color: var(--text-muted); padding: 12px 24px 12px 40px; text-align: left; font-size: 14px; cursor: pointer; transition: 0.2s; width: 100%; }
        .submenu-btn:hover { color: var(--text-main); background-color: var(--border-color); }
        .submenu-btn.active { color: #38bdf8; font-weight: bold; }

        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; background-color: var(--bg-main); }
        
        /* Górny pasek z nagłówkiem i przełącznikiem motywu */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .theme-toggle-btn { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .theme-toggle-btn:hover { background-color: var(--border-color); }

        .tab-content { display: none; padding: 24px; flex-direction: column; height: 100%; overflow-y: auto; }
        .tab-content.active { display: flex; }
        
        /* Pasek kategorii / filtrów */
        .category-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .cat-btn { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .cat-btn:hover { background-color: var(--border-color); color: var(--text-main); }
        .cat-btn.active { background-color: var(--accent); color: #fff; border-color: var(--accent); }

        .chat-container { flex: 1; background-color: var(--bg-container); border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* Karty ogłoszeń */
        .message-card { 
            background-color: var(--bg-card); 
            border-left: 4px solid #38bdf8; 
            padding: 16px; 
            border-radius: 0 8px 8px 0; 
            animation: slideIn 0.3s ease-out;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dimmed); }
        .card-title { font-size: 16px; font-weight: bold; color: var(--text-main); }
        .card-price { font-size: 18px; color: #22c55e; font-weight: bold; }
        .card-link { color: #38bdf8; font-size: 14px; text-decoration: none; }
        .card-link:hover { text-decoration: underline; }

        /* Przyciski akcji */
        .card-actions { display: flex; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-color); }
        .action-btn { padding: 6px 12px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-progress { background-color: #f59e0b; color: #fff; }
        .btn-progress:hover { background-color: #d97706; }
        .btn-reject { background-color: #ef4444; color: #fff; }
        .btn-reject:hover { background-color: #dc2626; }
        .btn-restore { background-color: var(--accent); color: #fff; }
        .btn-restore:hover { background-color: var(--accent-hover); }
        .btn-delete { background-color: var(--text-dimmed); color: #fff; }
        .btn-delete:hover { background-color: var(--text-muted); }

        .status-badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--accent); color: #fff; }

        /* Styl kontenera tabeli cen z możliwością rozwijania */
        .prices-wrapper { display: flex; flex-direction: column; gap: 8px; padding: 20px; overflow-y: auto; }

        /* Przycisk akcji dodawania okazjonalnego */
        .mini-btn {
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #fff;
            transition: 0.2s;
        }
        .mini-btn-nowe { background-color: #0284c7; }
        .mini-btn-nowe:hover { background-color: #0369a1; }
        .mini-btn-trakcie { background-color: #f59e0b; }
        .mini-btn-trakcie:hover { background-color: #d97706; }
        .mini-btn-odrzucone { background-color: #ef4444; }
        .mini-btn-odrzucone:hover { background-color: #dc2626; }
        
        /* Własne okienko GUI (Modal) na środku ekranu */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-title { font-size: 18px; font-weight: bold; color: var(--text-main); margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
        .modal-btn-cancel { background-color: var(--border-color); color: var(--text-muted); }
        .modal-btn-cancel:hover { background-color: var(--text-dimmed); color: var(--text-main); }
        .modal-btn-confirm { background-color: #ef4444; color: #fff; }
        .modal-btn-confirm:hover { background-color: #dc2626; }
    </style>
</head>
<body data-theme="dark">
    <div class="sidebar">
        <div class="logo">🎯 HuntBot Panel</div>
        
        <!-- Grupa menu z rozwijaną podzakładką -->
        <div class="menu-group">
            <button class="menu-btn active" id="mainMenuBtn" onclick="toggleIphoneMenu()">
                <span>📱 Bot iPhone (OLX)</span> <span>▼</span>
            </button>
            <div class="submenu open" id="iphoneSubmenu">
                <button class="submenu-btn active" onclick="switchTab('live', event)">🔴 OLX Live</button>
                <button class="submenu-btn" onclick="switchTab('prices', event)">📊 Średnie ceny Iphone</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <!-- 1. Zakładka główna: OLX Live -->
        <div id="tab-live" class="tab-content active">
            <div class="top-bar">
                <h2>Wyszukiwarka okazyjnych iPhone'ów</h2>
                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
                    <span id="themeIcon">☀️</span> <span id="themeText">Tryb jasny</span>
                </button>
            </div>
            
            <div class="category-tabs">
                <button class="cat-btn active" onclick="switchCategory('nowe', event)">🔥 Nowe</button>
                <button class="cat-btn" onclick="switchCategory('w trakcie', event)">⏳ W trakcie</button>
                <button class="cat-btn" onclick="switchCategory('odrzucone', event)">❌ Odrzucone</button>
            </div>

            <div class="chat-container">
                <div id="messagesContainer" class="chat-messages">
                    <p style="color: var(--text-muted); text-align: center;">Ładowanie ofert...</p>
                </div>
            </div>
        </div>

        <!-- 2. Podzakładka: Średnie ceny Iphone (Z rozwijanymi okazjami i przyciskami) -->
        <div id="tab-prices" class="tab-content">
            <div class="top-bar">
                <h2>Analiza średnich cen rynkowych iPhone (OLX)</h2>
                <button class="theme-toggle-btn" onclick="toggleTheme()">
                    <span>☀️</span> <span>Tryb jasny</span>
                </button>
            </div>
            
            <div class="chat-container" style="overflow-y: auto;">
                <div id="pricesTableBody" class="prices-wrapper">
                    <p style="text-align: center; color: var(--text-muted); padding: 20px;">Pobieranie danych rynkowych...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Własne okienko potwierdzenia (GUI Modal) -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">Potwierdź usunięcie</div>
            <div class="modal-desc">Czy na pewno chcesz trwale usunąć to ogłoszenie? Tej operacji nie można cofnąć.</div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Anuluj</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">Usuń trwale</button>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://nikvmsybrtgxcyuqpgkd.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_jUHmB7NrrMhlV4FjKYo1yQ_xBt7blfX"; 
    
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false },
        global: { headers: { 'apikey': SUPABASE_KEY } }
    });

    const container = document.getElementById('messagesContainer');
    let currentCategory = 'nowe'; 
    let offerToDeleteId = null;

    function toggleIphoneMenu() {
        const submenu = document.getElementById('iphoneSubmenu');
        submenu.classList.toggle('open');
    }

    function switchTab(tabName, event) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.submenu-btn').forEach(btn => btn.classList.remove('active'));

        if (tabName === 'live') {
            document.getElementById('tab-live').classList.add('active');
        } else if (tabName === 'prices') {
            document.getElementById('tab-prices').classList.add('active');
            fetchMarketAverages();
        }

        if (event && event.target) {
            event.target.classList.add('active');
        }
    }

    function toggleTheme() {
        const body = document.body;
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            if(themeIcon) themeIcon.textContent = '🌙';
            if(themeText) themeText.textContent = 'Tryb ciemny';
        } else {
            body.setAttribute('data-theme', 'dark');
            if(themeIcon) themeIcon.textContent = '☀️';
            if(themeText) themeText.textContent = 'Tryb jasny';
        }
    }

    function switchCategory(category, event) {
        currentCategory = category;
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
            event.target.classList.add('active');
        }
        fetchFilteredData();
    }

    async function updateOfferStatus(offerId, newStatus) {
        try {
            const { error } = await _supabase
                .from('offers')
                .update({ status: newStatus })
                .eq('id', offerId);

            if (error) throw error;

            const card = document.getElementById(`offer-${offerId}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(() => card.remove(), 250);
            }
        } catch (err) {
            alert("Błąd aktualizacji statusu: " + err.message);
        }
    }

    // Funkcja do ręcznego przesyłania konkretnej okazji ze średnich cen do 'OLX Live'
    async function sendDealToLive(title, price, url, targetStatus) {
        try {
            const { error } = await _supabase
                .from('offers')
                .insert([
                    {
                        title: title,
                        price: price,
                        url: url,
                        status: targetStatus,
                        source: "OLX Hunter",
                        description: `Dodano ręcznie z zakładki Średnie Ceny (${price} zł)`
                    }
                ]);

            if (error) throw error;
            alert(`✅ Pomyślnie dodano okazję do zakladki "${targetStatus}" w OLX Live!`);
        } catch (err) {
            alert("Błąd dodawania do OLX Live: " + err.message);
        }
    }

    function promptDeleteOffer(offerId) {
        offerToDeleteId = offerId;
        document.getElementById('confirmModal').classList.add('active');
    }

    function closeModal() {
        offerToDeleteId = null;
        document.getElementById('confirmModal').classList.remove('active');
    }

    document.getElementById('modalConfirmBtn').onclick = async function() {
        if (!offerToDeleteId) return;
        const idToDelete = offerToDeleteId;
        closeModal();

        try {
            const { error } = await _supabase
                .from('offers')
                .delete()
                .eq('id', idToDelete);

            if (error) throw error;

            const card = document.getElementById(`offer-${idToDelete}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(() => card.remove(), 250);
            }
        } catch (err) {
            alert("Błąd podczas usuwania ogłoszenia: " + err.message);
        }
    };

    function createCardElement(offer) {
        const card = document.createElement('div');
        card.className = 'message-card';
        card.id = `offer-${offer.id}`;

        let actionButtons = '';
        if (currentCategory === 'nowe') {
            actionButtons = `
                <button class="action-btn btn-progress" onclick="updateOfferStatus(${offer.id}, 'w trakcie')">⏳ W trakcie</button>
                <button class="action-btn btn-reject" onclick="updateOfferStatus(${offer.id}, 'odrzucone')">❌ Odrzuć</button>
            `;
        } else if (currentCategory === 'w trakcie') {
            actionButtons = `
                <button class="action-btn btn-restore" onclick="updateOfferStatus(${offer.id}, 'nowe')">↩️ Przywróć do Nowych</button>
                <button class="action-btn btn-reject" onclick="updateOfferStatus(${offer.id}, 'odrzucone')">❌ Odrzuć</button>
            `;
        } else if (currentCategory === 'odrzucone') {
            actionButtons = `
                <button class="action-btn btn-restore" onclick="updateOfferStatus(${offer.id}, 'nowe')">↩️ Przywróć do Nowych</button>
                <button class="action-btn btn-delete" onclick="promptDeleteOffer(${offer.id})">🗑️ Usuń trwale</button>
            `;
        }

        card.innerHTML = `
            <div class="card-header">
                <span>${offer.source || 'OLX Hunter'}</span>
                <span class="status-badge">${offer.status || 'nowe'}</span>
            </div>
            <div class="card-title">${offer.title || 'Brak tytułu'}</div>
            <div class="card-price">${offer.price ? offer.price + ' zł' : 'Brak ceny'}</div>
            <p style="font-size: 14px; color: var(--text-muted);">${offer.description || ''}</p>
            ${offer.url ? `<a href="${offer.url}" target="_blank" class="card-link">🔗 Otwórz ofertę na OLX</a>` : ''}
            <div class="card-actions">
                ${actionButtons}
            </div>
        `;
        return card;
    }

    async function fetchFilteredData() {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Wczytywanie...</p>`;
        try {
            let query = _supabase.from('offers').select('*').order('id', { ascending: false });

            if (currentCategory === 'nowe') {
                query = query.or('status.eq.nowe,status.eq.okazja,status.is.null');
            } else {
                query = query.eq('status', currentCategory);
            }

            const { data, error } = await query;
            if (error) throw error;

            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Brak ogłoszeń w tej kategorii.</p>`;
                return;
            }

            data.forEach(offer => {
                container.appendChild(createCardElement(offer));
            });
        } catch (err) {
            console.error("Błąd pobierania:", err);
            container.innerHTML = `<p style="color: #ef4444; text-align: center;">Błąd: ${err.message}</p>`;
        }
    }

    async function fetchMarketAverages() {
        const wrapper = document.getElementById('pricesTableBody');
        wrapper.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">Pobieranie aktualnych średnich cen...</p>';
        
        try {
            const { data, error } = await _supabase
                .from('market_averages')
                .select('*')
                .order('model', { ascending: true });

            if (error) throw error;

            wrapper.innerHTML = '';
            if (!data || data.length === 0) {
                wrapper.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">Brak zaktualizowanych średnich cen.</p>';
                return;
            }

            data.forEach(item => {
                const deals = item.deals || [];
                const dealsCount = deals.length;
                
                let dealsListHtml = '';
                if (dealsCount > 0) {
                    dealsListHtml = deals.map(d => {
                        // Bezpieczne kodowanie ciągów do funkcji onclick
                        const safeTitle = d.title.replace(/'/g, "\\'");
                        const safeLink = d.link.replace(/'/g, "\\'");

                        return `
                        <div style="padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                            <a href="${d.link}" target="_blank" style="color: #38ef7d; text-decoration: none; font-weight: 500; font-size: 13px; flex: 1; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                                🔗 ${d.title}
                            </a>
                            <span style="color: #fff; font-weight: bold; background: #11998e; padding: 2px 6px; border-radius: 4px; font-size: 13px;">
                                ${d.price} zł
                            </span>
                            <div style="display: flex; gap: 4px;">
                                <button class="mini-btn mini-btn-nowe" title="Dodaj do Nowe" onclick="sendDealToLive('${safeTitle}', ${d.price}, '${safeLink}', 'nowe')">🔥 Nowe</button>
                                <button class="mini-btn mini-btn-trakcie" title="Dodaj do W trakcie" onclick="sendDealToLive('${safeTitle}', ${d.price}, '${safeLink}', 'w trakcie')">⏳ W trakcie</button>
                                <button class="mini-btn mini-btn-odrzucone" title="Dodaj do Odrzucone" onclick="sendDealToLive('${safeTitle}', ${d.price}, '${safeLink}', 'odrzucone')">❌ Odrzuć</button>
                            </div>
                        </div>
                    `}).join('');
                } else {
                    dealsListHtml = `<div style="padding: 10px; color: var(--text-muted); font-size: 13px;">Brak ofert tańszych o co najmniej 100 zł od średniej w ostatnim skanie.</div>`;
                }

                let formattedDate = 'Brak danych';
                if (item.updated_at) {
                    const dateObj = new Date(item.updated_at);
                    formattedDate = dateObj.toLocaleString('pl-PL', {
                        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });
                }

                const row = document.createElement('div');
                row.innerHTML = `
                    <details style="background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color);">
                        <summary style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; cursor: pointer; user-select: none;">
                            <span style="color: #38bdf8; font-weight: bold; width: 25%;">${item.model}</span>
                            <span style="color: #22c55e; font-weight: bold; width: 20%;">${item.avg_price ? item.avg_price + ' zł' : 'Brak'}</span>
                            <span style="color: var(--text-muted); width: 20%;">${item.offers_count || 0} ofert</span>
                            <span style="color: #f59e0b; font-weight: bold; font-size: 0.9em; width: 15%;">${dealsCount} okazji 🔥</span>
                            <span style="color: var(--text-dimmed); font-size: 0.85em; width: 20%; text-align: right;">${formattedDate}</span>
                        </summary>
                        <div style="background: rgba(0,0,0,0.2); padding: 12px; border-top: 1px solid var(--border-color);">
                            <div style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 8px;">
                                Wybierz status, aby dodać okazję do zakładki <b>OLX Live</b>:
                            </div>
                            ${dealsListHtml}
                        </div>
                    </details>
                `;
                wrapper.appendChild(row);
            });
        } catch (err) {
            console.error("Błąd pobierania średnich cen:", err);
            wrapper.innerHTML = `<p style="text-align: center; color: #ef4444; padding: 20px;">Błąd: ${err.message}</p>`;
        }
    }

    function subscribeToRealtime() {
        _supabase
            .channel('public:offers')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'offers' }, payload => {
                if (payload.eventType === 'INSERT' && currentCategory === 'nowe') {
                    if (container.querySelector('p')) container.innerHTML = '';
                    const newCard = createCardElement(payload.new);
                    container.insertBefore(newCard, container.firstChild);
                }
            })
            .subscribe();
    }

    fetchFilteredData();
    subscribeToRealtime();
</script>
</body>
</html>
