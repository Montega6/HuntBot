<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Bot Dashboard</title>
    <!-- Oficjalna biblioteka Supabase przez CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #0e1118; color: #e2e8f0; overflow: hidden; }
        .sidebar { width: 260px; background-color: #161b26; display: flex; flex-direction: column; border-right: 1px solid #242c3d; }
        .logo { padding: 24px; font-size: 20px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #242c3d; }
        .menu-btn { background: none; border: none; color: #94a3b8; padding: 16px 24px; text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s; width: 100%; }
        .menu-btn.active { background-color: #0284c7; color: #fff; font-weight: bold; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .tab-content { display: flex; padding: 24px; flex-direction: column; height: 100%; overflow-y: auto; }
        
        /* Pasek kategorii / filtrów */
        .category-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #242c3d; padding-bottom: 12px; }
        .cat-btn { background-color: #1b2336; border: 1px solid #242c3d; color: #94a3b8; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .cat-btn:hover { background-color: #242c3d; color: #fff; }
        .cat-btn.active { background-color: #0284c7; color: #fff; border-color: #0284c7; }

        .chat-container { flex: 1; background-color: #111622; border-radius: 12px; border: 1px solid #242c3d; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* Karty ogłoszeń */
        .message-card { 
            background-color: #1b2336; 
            border-left: 4px solid #38bdf8; 
            padding: 16px; 
            border-radius: 0 8px 8px 0; 
            animation: slideIn 0.3s ease-out;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; }
        .card-title { font-size: 16px; font-weight: bold; color: #fff; }
        .card-price { font-size: 18px; color: #22c55e; font-weight: bold; }
        .card-link { color: #38bdf8; font-size: 14px; text-decoration: none; }
        .card-link:hover { text-decoration: underline; }

        /* Przyciski akcji */
        .card-actions { display: flex; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #242c3d; }
        .action-btn { padding: 6px 12px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-progress { background-color: #f59e0b; color: #fff; }
        .btn-progress:hover { background-color: #d97706; }
        .btn-reject { background-color: #ef4444; color: #fff; }
        .btn-reject:hover { background-color: #dc2626; }
        .btn-restore { background-color: #0284c7; color: #fff; }
        .btn-restore:hover { background-color: #0369a1; }

        .status-badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: #0284c7; color: #fff; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🎯 HuntBot Panel</div>
        <button class="menu-btn active">📱 Bot iPhone (OLX Live)</button>
    </div>
    <div class="main-content">
        <div id="iphone-tab" class="tab-content">
            <h2>Wyszukiwarka okazyjnych iPhone'ów</h2>
            
            <!-- Nawigacja po kategoriach / statusach -->
            <div class="category-tabs">
                <button class="cat-btn active" onclick="switchCategory('nowe', event)">🔥 Nowe</button>
                <button class="cat-btn" onclick="switchCategory('in_progress', event)">⏳ W trakcie</button>
                <button class="cat-btn" onclick="switchCategory('rejected', event)">❌ Odrzucone</button>
            </div>

            <div class="chat-container">
                <div id="messagesContainer" class="chat-messages">
                    <p style="color: #38bdf8; text-align: center;">Ładowanie ofert...</p>
                </div>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://nikvmsybrtgxcyuqpgkd.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_jUHmB7NrrMhlV4FjKYo1yQ_xBt7blfX"; 
    
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false },
        global: { headers: { 'apikey': SUPABASE_KEY } }
    });

    const container = document.getElementById('messagesContainer');
    let currentCategory = 'nowe'; // Domyślna kategoria to 'nowe'

    // Zmiana aktywnej zakładki
    function switchCategory(category, event) {
        currentCategory = category;
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
            event.target.classList.add('active');
        }
        fetchFilteredData();
    }

    // Aktualizacja statusu ogłoszenia w bazie Supabase
    async function updateOfferStatus(offerId, newStatus) {
        try {
            const { error } = await _supabase
                .from('offers')
                .update({ status: newStatus })
                .eq('id', offerId);

            if (error) throw error;

            // Płynne usunięcie karty z aktualnego widoku
            const card = document.getElementById(`offer-${offerId}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(() => card.remove(), 250);
            }
        } catch (err) {
            alert("Błąd aktualizacji statusu: " + err.message);
        }
    }

    // Generator widoku karty w zależności od wybranej zakładki
    function createCardElement(offer) {
        const card = document.createElement('div');
        card.className = 'message-card';
        card.id = `offer-${offer.id}`;

        let actionButtons = '';
        if (currentCategory === 'nowe') {
            actionButtons = `
                <button class="action-btn btn-progress" onclick="updateOfferStatus(${offer.id}, 'in_progress')">⏳ W trakcie</button>
                <button class="action-btn btn-reject" onclick="updateOfferStatus(${offer.id}, 'rejected')">❌ Odrzuć</button>
            `;
        } else if (currentCategory === 'in_progress') {
            actionButtons = `
                <button class="action-btn btn-restore" onclick="updateOfferStatus(${offer.id}, 'nowe')">↩️ Przywróć do Nowych</button>
                <button class="action-btn btn-reject" onclick="updateOfferStatus(${offer.id}, 'rejected')">❌ Odrzuć</button>
            `;
        } else if (currentCategory === 'rejected') {
            actionButtons = `
                <button class="action-btn btn-restore" onclick="updateOfferStatus(${offer.id}, 'nowe')">↩️ Przywróć do Nowych</button>
            `;
        }

        card.innerHTML = `
            <div class="card-header">
                <span>${offer.source || 'OLX Hunter'}</span>
                <span class="status-badge">${offer.status || 'nowe'}</span>
            </div>
            <div class="card-title">${offer.title || 'Brak tytułu'}</div>
            <div class="card-price">${offer.price ? offer.price + ' zł' : 'Brak ceny'}</div>
            <p style="font-size: 14px; color: #94a3b8;">${offer.description || ''}</p>
            ${offer.url ? `<a href="${offer.url}" target="_blank" class="card-link">🔗 Otwórz ofertę na OLX</a>` : ''}
            <div class="card-actions">
                ${actionButtons}
            </div>
        `;
        return card;
    }

    // Pobieranie przefiltrowanych danych z Supabase
    async function fetchFilteredData() {
        container.innerHTML = '<p style="color: #64748b; text-align: center;">Wczytywanie...</p>';
        try {
            let query = _supabase.from('offers').select('*').order('id', { ascending: false });

            if (currentCategory === 'nowe') {
                // Łapie status 'nowe' oraz wpisy z pustym statusem (żeby starsze testowe też się pojawiły)
                query = query.or('status.eq.nowe,status.is.null');
            } else {
                query = query.eq('status', currentCategory);
            }

            const { data, error } = await query;
            if (error) throw error;

            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.innerHTML = `<p style="color: #64748b; text-align: center;">Brak ogłoszeń w tej kategorii.</p>`;
                return;
            }

            data.forEach(offer => {
                container.appendChild(createCardElement(offer));
            });
        } catch (err) {
            console.error("Błąd pobierania:", err);
            container.innerHTML = `<p style="color: #ef4444; text-align: center;">Błąd: ${err.message}</p>`;
        }
    }

    // Subskrypcja zdarzeń na żywo (Realtime)
    function subscribeToRealtime() {
        _supabase
            .channel('public:offers')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'offers' }, payload => {
                // Jeśli dodano nową ofertę i jesteśmy w zakładce 'Nowe', wstawiamy ją na górę
                if (payload.eventType === 'INSERT' && currentCategory === 'nowe') {
                    if (container.querySelector('p')) container.innerHTML = '';
                    const newCard = createCardElement(payload.new);
                    container.insertBefore(newCard, container.firstChild);
                }
            })
            .subscribe();
    }

    // Start
    fetchFilteredData();
    subscribeToRealtime();
</script>
</body>
</html>
