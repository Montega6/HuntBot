<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Bot Dashboard</title>
    <!-- Oficjalna biblioteka Supabase przez CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="messagesContainer">Ładowanie danych...</div>

    <script>
        const SUPABASE_URL = "https://nikvmsybrtgxcyuqpgkd.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_jUHmB7NrrMhlV4FjKYo1yQ_xBt7blfX"; 
        
        // Inicjalizacja z jawnie dodanym nagłówkiem apikey
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false },
            global: {
                headers: {
                    'apikey': SUPABASE_KEY
                }
            }
        });

        async function fetchDatabase() {
            const { data, error } = await _supabase
                .from('offers')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Błąd:", error.message);
                document.getElementById('messagesContainer').innerText = "Błąd: " + error.message;
                return;
            }

            console.log("Dane z bazy:", data);
        }

        fetchDatabase();
    </script>
</body>
</html>
