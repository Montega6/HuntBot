<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Bot Dashboard</title>
    <!-- Oficjalna biblioteka Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #0e1118; color: #e2e8f0; overflow: hidden; }
        .sidebar { width: 260px; background-color: #161b26; display: flex; flex-direction: column; border-right: 1px solid #242c3d; }
        .logo { padding: 24px; font-size: 20px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #242c3d; }
        .menu-btn { background: none; border: none; color: #94a3b8; padding: 16px 24px; text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s; width: 100%; }
        .menu-btn:hover { background-color: #1e2638; color: #fff; }
        .menu-btn.active { background-color: #0284c7; color: #fff; font-weight: bold; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .tab-content { display: flex; padding: 24px; flex-direction: column; height: 100%; overflow-y: auto; }
        .chat-container { flex: 1; background-color: #111622; border-radius: 12px; border: 1px solid #242c3d; display: flex; flex-direction: column; overflow: hidden; margin-top: 15px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message-card { background-color: #1b2336; border-left: 4px solid #38bdf8; padding: 16px; border-radius: 0 8px 8px 0; }
        .card-header { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-bottom: 6px; }
        .card-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .card-price { font-size: 18px; color: #38bdf8; font-weight: bold; }
        .card-link { display: inline-block; margin-top: 8px; color: #94a3b8; font-size: 14px; text-decoration: none; }
        .card-link:hover { color: #38bdf8; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🎯 HuntBot Panel</div>
        <button class="menu-btn active">📱 Bot iPhone (OLX/Allegro)</button>
    </div>
    <div class="main-content">
        <div id="iphone-tab" class="tab-content">
            <h2>Wyszukiwarka ogłoszeń: iPhone</h2>
            <p style="color: #64748b;">Nowe ogłoszenia pojawią się tutaj na żywo.</p>
            <div class="chat-container">
                <div id="messagesContainer" class="chat-messages">
                    <p style="color: #64748b; text-align: center;">Pobieranie danych z bazy...</p>
                </div>
            </div>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://nikvmsybrtgxcyuqpgkd.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_jUHmB7NrrMhlV4FjKYo1yQ_xBt7blfX"; 
    
    // Inicjalizacja z poprawnymi nagłówkami dla klucza publishable
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: false },
        global: {
            headers: {
                'apikey': SUPABASE_KEY
            }
        }
    });

    async function fetchDatabase() {
        try {
            const { data, error } = await _supabase
                .from('offers')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;
            renderOffers(data);
        } catch (error) {
            console.error("Szczegóły błędu:", error);
            renderOffers([
                { 
                    source: "SYSTEM", 
                    title: "Błąd połączenia z bazą", 
                    price: "Sprawdź konsolę", 
                    description: `Treść błędu: ${error.message || JSON.stringify(error)}` 
                }
            ]);
        }
    }

    function renderOffers(offers) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;
        
        container.innerHTML = '';

        if (!offers || offers.length === 0) {
            container.innerHTML = `<p style="color: #64748b; text-align: center;">Połączono! Tabela 'offers' jest pusta. Bot może zacząć wysyłać ogłoszenia.</p>`;
            return;
        }

        offers.forEach(offer => {
            const card = document.createElement('div');
            card.className = 'message-card';

            card.innerHTML = `
                <div class="card-header">
                    <span>${offer.source || 'Bot'}</span>
                    <span>Status: ${offer.status || 'Nowe'}</span>
                </div>
                <div class="card-title">${offer.title || 'Brak tytułu'}</div>
                <div class="card-price">${offer.price ? offer.price + ' zł' : 'Cena do negocjacji'}</div>
                <p style="font-size: 14px; margin-top: 5px; color: #94a3b8;">${offer.description || ''}</p>
                ${offer.url ? `<a href="${offer.url}" target="_blank" class="card-link">🔗 Zobacz ogłoszenie</a>` : ''}
            `;
            container.appendChild(card);
        });
    }

    fetchDatabase();
    setInterval(fetchDatabase, 7000);
</script>
</body>
</html>
